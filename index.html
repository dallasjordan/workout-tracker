<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Full Body + Cardio</title>
<style>
  :root {
    --bg: #161C18;
    --surface: #1E2520;
    --surface-2: #262F28;
    --border: #38423A;
    --text: #EDEFE7;
    --text-dim: #97A297;
    --text-faint: #626C63;
    --strength: #86AE8F;
    --strength-dim: #4E5F51;
    --cardio: #7098B0;
    --cardio-dim: #40525E;
    --ski: #CC9257;
    --ski-dim: #5E523D;
    --rest: #8A8F87;
    --rest-dim: #454B44;
    --danger: #BD6A50;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  body {
    padding: 20px 18px 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  header.top {
    margin-bottom: 24px;
  }

  .date-label {
    color: var(--text-dim);
    font-size: 0.8125rem;
    margin: 0 0 2px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .streak-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .streak-num {
    font-size: 2rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .streak-label {
    color: var(--text-dim);
    font-size: 0.875rem;
  }

  section {
    margin-top: 28px;
  }

  h2 {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 10px;
  }

  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--tile-color, var(--border));
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
    transition: background 0.15s ease;
  }

  .tile-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px;
    cursor: pointer;
    user-select: none;
  }

  .tile-head:active { background: var(--surface-2); }

  .tile-name {
    font-size: 0.9375rem;
    font-weight: 550;
  }

  .tile-sub {
    font-size: 0.75rem;
    color: var(--text-faint);
    margin-top: 1px;
  }

  .tile-chevron {
    color: var(--text-faint);
    font-size: 0.75rem;
    transition: transform 0.15s ease;
  }

  .tile.open .tile-chevron { transform: rotate(90deg); }

  .tile-body {
    display: none;
    padding: 4px 14px 16px;
    border-top: 1px solid var(--border);
  }

  .tile.open .tile-body { display: block; }

  .exercise-list {
    margin: 12px 0;
    padding: 0;
    list-style: none;
  }

  .exercise-list li {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.8438rem;
    line-height: 1.4;
  }

  .exercise-list li:last-child { border-bottom: none; }

  .ex-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .ex-name { font-weight: 550; }

  .ex-info-toggle {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 0.6875rem;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
  }

  .ex-variant {
    color: var(--text-dim);
    display: block;
    margin-top: 1px;
  }

  .ex-tip {
    display: none;
    color: var(--text-dim);
    font-size: 0.78125rem;
    line-height: 1.5;
    margin: 8px 0 0;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: var(--radius);
  }

  .field-row {
    margin: 12px 0 10px;
  }

  .field-label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .seg {
    display: flex;
    gap: 6px;
  }

  .seg button {
    flex: 1;
    padding: 8px 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 0.8125rem;
    cursor: pointer;
  }

  .seg button.active {
    background: var(--tile-color, var(--strength));
    border-color: var(--tile-color, var(--strength));
    color: #12160F;
    font-weight: 600;
  }

  input[type="number"], input[type="text"] {
    width: 100%;
    padding: 9px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 0.875rem;
    font-family: inherit;
  }

  input::placeholder { color: var(--text-faint); }

  .log-btn {
    width: 100%;
    margin-top: 14px;
    padding: 11px;
    background: var(--tile-color, var(--strength));
    border: none;
    border-radius: var(--radius);
    color: #12160F;
    font-size: 0.875rem;
    font-weight: 650;
    cursor: pointer;
  }

  .log-btn:active { opacity: 0.85; }

  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .week-header h2 { margin: 0; }

  .week-nav {
    display: flex;
    gap: 6px;
  }

  .week-nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 0.75rem;
    padding: 5px 10px;
    cursor: pointer;
  }

  .week-nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day-cell {
    text-align: center;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  .day-dot {
    width: 100%;
    max-width: 34px;
    aspect-ratio: 1;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    margin: 0 auto 5px;
  }

  .day-cell.is-selected .day-dot {
    box-shadow: 0 0 0 2px var(--text) inset;
  }

  .day-dot.is-today {
    border-color: var(--text-dim);
    border-width: 2px;
  }

  .day-letter {
    font-size: 0.6875rem;
    color: var(--text-faint);
  }

  .day-detail {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.8125rem;
  }

  .day-detail.show { display: block; }

  .day-detail .dd-date {
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-bottom: 3px;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }

  .history-item:last-child { border-bottom: none; }

  .hist-main { flex: 1; min-width: 0; }

  .hist-type {
    font-size: 0.8438rem;
    font-weight: 550;
  }

  .hist-detail {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .hist-date {
    font-size: 0.75rem;
    color: var(--text-faint);
    white-space: nowrap;
    padding-top: 1px;
  }

  .hist-del {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 2px 0 2px 8px;
  }

  .empty-note {
    color: var(--text-faint);
    font-size: 0.8125rem;
    padding: 4px 0;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 0.8125rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header class="top">
  <p class="date-label" id="todayLabel"></p>
  <h1>Today's session</h1>
  <div class="streak-row">
    <span class="streak-num" id="streakNum">0</span>
    <span class="streak-label">day streak</span>
  </div>
</header>

<section>
  <h2>Choose one</h2>
  <div id="tiles"></div>
</section>

<section>
  <div class="week-header">
    <h2 id="weekLabel">This week</h2>
    <div class="week-nav">
      <button id="weekPrev" class="week-nav-btn" aria-label="Previous week">Prev</button>
      <button id="weekNext" class="week-nav-btn" aria-label="Next week">Next</button>
    </div>
  </div>
  <div class="week-row" id="weekRow"></div>
  <div class="day-detail" id="dayDetail"></div>
</section>

<section>
  <h2>History</h2>
  <div id="history"></div>
</section>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'sessions';

const TYPES = {
  fullA: {
    label: 'Full Body A', sub: 'Push · Squat · Hinge · Core', color: 'var(--strength)',
    exercises: [
      { name: 'Push-ups', low: 'Knee or incline push-ups — 3 x 8', med: 'Standard push-ups — 3 x 12',
        tip: 'Hands slightly wider than shoulders, body in a straight line from head to heels (or head to knees on the knee version). Lower until your chest nearly touches the floor, elbows tracking back at roughly 45°, then press up without letting your hips sag or pike up.' },
      { name: 'Bodyweight squats', low: 'Chair-assisted squats — 3 x 10', med: 'Full squats — 4 x 15',
        tip: 'Feet shoulder-width apart, toes slightly out. Push your hips back and bend the knees as if sitting into a chair, keeping your chest up and heels down. Go as low as you can with control — for the chair version, lightly tap the seat before standing back up.' },
      { name: 'Glute bridges', low: 'Bridges — 3 x 12', med: 'Single-leg bridges — 3 x 10 each side',
        tip: 'Lie on your back, knees bent, feet flat and hip-width apart. Squeeze your glutes to lift your hips until your body forms a straight line from shoulders to knees, then lower slowly. For the single-leg version, extend one leg straight and drive through the planted heel.' },
      { name: 'Plank', low: 'Knee plank — 3 x 20s', med: 'Standard plank — 3 x 40s',
        tip: 'Forearms on the floor, elbows under shoulders. Keep a straight line from head to heels (or head to knees) by squeezing glutes and bracing your abs — don\'t let your hips sag or rise up.' },
      { name: 'Mountain climbers', low: 'Slow pace — 3 x 20', med: 'Fast pace — 3 x 30',
        tip: 'Start in a high plank. Drive one knee toward your chest then swap legs, keeping your hips low and steady rather than bouncing. Count each knee drive as one rep.' }
    ]
  },
  fullB: {
    label: 'Full Body B', sub: 'Push · Lunge · Back · Core', color: 'var(--strength)',
    exercises: [
      { name: 'Pike push-ups', low: 'Hands elevated on chair — 3 x 8', med: 'Standard pike push-up — 3 x 10',
        tip: 'Start in a downward-dog-like position, hips high, hands on the floor (or an elevated surface for the easier version). Bend your elbows to lower the top of your head toward your hands, then press back up. This targets the shoulders more than a flat push-up.' },
      { name: 'Reverse lunges', low: 'Hold wall for balance — 3 x 8 each side', med: 'Unassisted — 3 x 12 each side',
        tip: 'Step one foot backward and lower your back knee toward the floor, keeping your front shin roughly vertical and chest upright. Push through your front heel to return to standing. Hold a wall or chair lightly with one hand if balance is the limiting factor.' },
      { name: 'Superman', low: 'Hold — 3 x 20s', med: 'Arm/leg raises — 3 x 15',
        tip: 'Lie face down, arms extended overhead. Lift your arms, chest and legs a few inches off the floor at once, squeezing your lower back and glutes, then lower with control. For the moving version, alternate lifting opposite arm and leg.' },
      { name: 'Side plank', low: 'Knee down — 3 x 15s each side', med: 'Standard — 3 x 30s each side',
        tip: 'Lie on your side, forearm on the floor directly under your shoulder. Lift your hips so your body forms a straight line, stacking feet (or bending the bottom knee for the easier version). Keep hips pushed forward, not sagging back.' },
      { name: 'Bear crawl', low: 'Static hold — 3 x 20s', med: 'Crawl forward/back — 3 x 30s',
        tip: 'Start on hands and knees, then lift your knees an inch off the floor so weight is on hands and toes. Keep your back flat and hips level. For the moving version, crawl forward by moving opposite hand and foot together, staying low and controlled.' }
    ]
  },
  cardio: { label: 'Cardio', sub: 'Run · Cycle · Swim', color: 'var(--cardio)' },
  ski: { label: 'Ski Tour', sub: 'Logged separately from cardio', color: 'var(--ski)' },
  rest: { label: 'Rest', sub: 'No session today', color: 'var(--rest)' }
};

let sessions = [];
let openTile = null;
let formState = {};
let weekOffset = 0;

function getWeekStart(offset) {
  const d = new Date();
  const dow = d.getDay(); // 0 = Sun ... 6 = Sat
  const sinceMonday = (dow + 6) % 7;
  d.setDate(d.getDate() - sinceMonday + offset * 7);
  d.setHours(0, 0, 0, 0);
  return d;
}

async function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  } catch (e) {
    sessions = [];
  }
}

async function saveSessions() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  } catch (e) {
    showToast('Could not save — try again');
  }
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

function computeStreak() {
  const days = new Set(sessions.map(s => s.date));
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const key = cursor.toISOString().slice(0, 10);
    if (days.has(key)) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function renderTiles() {
  const container = document.getElementById('tiles');
  container.innerHTML = '';
  Object.entries(TYPES).forEach(([key, def]) => {
    const tile = document.createElement('div');
    tile.className = 'tile' + (openTile === key ? ' open' : '');
    tile.style.setProperty('--tile-color', def.color);

    const head = document.createElement('div');
    head.className = 'tile-head';
    head.innerHTML = `
      <div>
        <div class="tile-name">${def.label}</div>
        <div class="tile-sub">${def.sub}</div>
      </div>
      <div class="tile-chevron">›</div>
    `;
    head.onclick = () => {
      openTile = openTile === key ? null : key;
      formState = {};
      renderTiles();
    };
    tile.appendChild(head);

    const body = document.createElement('div');
    body.className = 'tile-body';
    body.innerHTML = buildFormHTML(key, def);
    tile.appendChild(body);

    container.appendChild(tile);
  });

  if (openTile) attachFormHandlers(openTile, TYPES[openTile]);
}

function buildFormHTML(key, def) {
  if (key === 'fullA' || key === 'fullB') {
    const list = def.exercises.map(ex => `
      <li>
        <div class="ex-row">
          <span class="ex-name">${ex.name}</span>
          <button class="ex-info-toggle" type="button">How to</button>
        </div>
        <span class="ex-variant" data-low>${ex.low}</span>
        <span class="ex-variant" data-med style="display:none">${ex.med}</span>
        <p class="ex-tip">${ex.tip}</p>
      </li>
    `).join('');
    return `
      <ul class="exercise-list">${list}</ul>
      <div class="field-row">
        <span class="field-label">Intensity</span>
        <div class="seg" data-field="intensity">
          <button data-val="Low" class="active">Low</button>
          <button data-val="Medium">Medium</button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">Notes (optional)</span>
        <input type="text" data-field="notes" placeholder="e.g. felt strong, cut it short">
      </div>
      <button class="log-btn">Log session</button>
    `;
  }
  if (key === 'cardio') {
    return `
      <div class="field-row">
        <span class="field-label">Activity</span>
        <div class="seg" data-field="activity">
          <button data-val="Running" class="active">Running</button>
          <button data-val="Cycling">Cycling</button>
          <button data-val="Swimming">Swimming</button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">Duration (minutes)</span>
        <input type="number" data-field="duration" placeholder="30">
      </div>
      <div class="field-row">
        <span class="field-label">Intensity</span>
        <div class="seg" data-field="intensity">
          <button data-val="Easy" class="active">Easy</button>
          <button data-val="Moderate">Moderate</button>
          <button data-val="Hard">Hard</button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">Notes (optional)</span>
        <input type="text" data-field="notes" placeholder="e.g. loop round the park">
      </div>
      <button class="log-btn">Log session</button>
    `;
  }
  if (key === 'ski') {
    return `
      <div class="field-row">
        <span class="field-label">Duration (hours)</span>
        <input type="number" data-field="duration" placeholder="5.5" step="0.5">
      </div>
      <div class="field-row">
        <span class="field-label">Notes (optional)</span>
        <input type="text" data-field="notes" placeholder="e.g. route, conditions">
      </div>
      <button class="log-btn">Log session</button>
    `;
  }
  if (key === 'rest') {
    return `
      <div class="field-row">
        <span class="field-label">Notes (optional)</span>
        <input type="text" data-field="notes" placeholder="e.g. travel day">
      </div>
      <button class="log-btn">Log session</button>
    `;
  }
  return '';
}

function attachFormHandlers(key, def) {
  const tile = document.querySelectorAll('.tile.open')[0];
  if (!tile) return;

  formState = { intensity: (key === 'cardio' ? 'Easy' : 'Low'), activity: 'Running' };

  tile.querySelectorAll('.seg').forEach(seg => {
    const field = seg.dataset.field;
    seg.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        seg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        formState[field] = btn.dataset.val;
        if (field === 'intensity' && (key === 'fullA' || key === 'fullB')) {
          const showMed = btn.dataset.val === 'Medium';
          tile.querySelectorAll('[data-low]').forEach(el => el.style.display = showMed ? 'none' : '');
          tile.querySelectorAll('[data-med]').forEach(el => el.style.display = showMed ? '' : 'none');
        }
      };
    });
  });

  tile.querySelectorAll('.ex-info-toggle').forEach(btn => {
    btn.onclick = () => {
      const tip = btn.closest('li').querySelector('.ex-tip');
      const isOpen = tip.style.display === 'block';
      tip.style.display = isOpen ? 'none' : 'block';
      btn.textContent = isOpen ? 'How to' : 'Hide';
    };
  });

  tile.querySelectorAll('input').forEach(inp => {
    inp.oninput = () => { formState[inp.dataset.field] = inp.value; };
  });

  const logBtn = tile.querySelector('.log-btn');
  logBtn.onclick = async () => {
    const entry = {
      date: todayStr(),
      type: key,
      typeLabel: def.label,
      ...formState
    };
    sessions.push(entry);
    await saveSessions();
    openTile = null;
    formState = {};
    renderAll();
    showToast(def.label + ' logged');
  };
}

function describeSession(s) {
  if (s.type === 'fullA' || s.type === 'fullB') return s.intensity + ' intensity';
  if (s.type === 'cardio') return `${s.activity || ''} · ${s.duration || '?'} min · ${s.intensity || ''}`;
  if (s.type === 'ski') return `${s.duration || '?'} hrs`;
  return '';
}

function showDayDetail(dateKey) {
  const panel = document.getElementById('dayDetail');
  const entry = sessions.find(s => s.date === dateKey);
  panel.innerHTML = `<div class="dd-date">${fmtDate(dateKey)}</div>` +
    (entry
      ? `<div>${entry.typeLabel} — ${describeSession(entry)}${entry.notes ? ' — ' + entry.notes : ''}</div>`
      : `<div>Nothing logged</div>`);
  panel.classList.add('show');

  document.querySelectorAll('.day-cell').forEach(el => {
    el.classList.toggle('is-selected', el.dataset.date === dateKey);
  });
}

function renderWeek() {
  const row = document.getElementById('weekRow');
  row.innerHTML = '';
  document.getElementById('dayDetail').classList.remove('show');
  const colorMap = {
    fullA: 'var(--strength)', fullB: 'var(--strength)',
    cardio: 'var(--cardio)', ski: 'var(--ski)', rest: 'var(--rest)'
  };
  const byDate = {};
  sessions.forEach(s => { byDate[s.date] = s.type; });

  const monday = getWeekStart(weekOffset);
  const today = todayStr();
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0, 10);
    cells.push({ key, letter: d.toLocaleDateString('en-GB', { weekday: 'narrow' }) });
  }

  cells.forEach(c => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'day-cell';
    cell.dataset.date = c.key;
    const dot = document.createElement('div');
    dot.className = 'day-dot' + (c.key === today ? ' is-today' : '');
    if (byDate[c.key]) {
      dot.style.background = colorMap[byDate[c.key]];
      dot.style.borderColor = colorMap[byDate[c.key]];
    }
    const letter = document.createElement('div');
    letter.className = 'day-letter';
    letter.textContent = c.letter;
    cell.appendChild(dot);
    cell.appendChild(letter);
    cell.onclick = () => showDayDetail(c.key);
    row.appendChild(cell);
  });

  const label = document.getElementById('weekLabel');
  if (weekOffset === 0) {
    label.textContent = 'This week';
  } else {
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    const opts = { day: 'numeric', month: 'short' };
    label.textContent = monday.toLocaleDateString('en-GB', opts) + ' – ' + sunday.toLocaleDateString('en-GB', opts);
  }

  document.getElementById('weekNext').disabled = weekOffset >= 0;
}

function renderHistory() {
  const container = document.getElementById('history');
  container.innerHTML = '';
  if (sessions.length === 0) {
    container.innerHTML = '<p class="empty-note">Nothing logged yet — pick something above to start.</p>';
    return;
  }
  const sorted = [...sessions].sort((a, b) => b.date.localeCompare(a.date));
  sorted.slice(0, 30).forEach(s => {
    const item = document.createElement('div');
    item.className = 'history-item';
    let detail = '';
    if (s.type === 'fullA' || s.type === 'fullB') detail = s.intensity + ' intensity';
    if (s.type === 'cardio') detail = `${s.activity || ''} · ${s.duration || '?'} min · ${s.intensity || ''}`;
    if (s.type === 'ski') detail = `${s.duration || '?'} hrs`;
    if (s.notes) detail += (detail ? ' — ' : '') + s.notes;

    item.innerHTML = `
      <div class="hist-main">
        <div class="hist-type">${s.typeLabel}</div>
        <div class="hist-detail">${detail}</div>
      </div>
      <div class="hist-date">${fmtDate(s.date)}</div>
      <button class="hist-del" title="Delete">✕</button>
    `;
    item.querySelector('.hist-del').onclick = async () => {
      const idx = sessions.indexOf(s);
      if (idx > -1) sessions.splice(idx, 1);
      await saveSessions();
      renderAll();
    };
    container.appendChild(item);
  });
}

function renderAll() {
  document.getElementById('streakNum').textContent = computeStreak();
  renderTiles();
  renderWeek();
  renderHistory();
}

document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-GB', {
  weekday: 'long', day: 'numeric', month: 'long'
});

document.getElementById('weekPrev').onclick = () => { weekOffset -= 1; renderWeek(); };
document.getElementById('weekNext').onclick = () => { if (weekOffset < 0) { weekOffset += 1; renderWeek(); } };

(async () => {
  await loadSessions();
  renderAll();
})();
</script>

</body>
</html>
